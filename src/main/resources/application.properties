server.port=8085

spring.application.name=CyberShield

# ============================================================
# H2 Embedded SQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/cybershield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Visual Web Console (Accessible at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spring Data JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ============================================================
# Layer 3: VirusTotal Threat Intelligence Configuration
# ============================================================
# Leave empty to run in Sandbox/Simulation Intelligence mode for offline demos.
# Or provide your free VirusTotal API key (from https://www.virustotal.com/gui/my-apikey)
virustotal.api.key=${VIRUSTOTAL_API_KEY:}
# Predefined risk threshold: if heuristic score >= threshold, VT API is queried
virustotal.risk.threshold=6.0

# ============================================================
# Supabase Database Configuration (Optional Cloud Sync)
# ============================================================
supabase.enabled=${SUPABASE_ENABLED:false}
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}

# Logging Configuration
logging.level.com.cybershield=INFO
logging.level.org.hibernate=WARN
